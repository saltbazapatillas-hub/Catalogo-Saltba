name: Actualizar catálogo

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch:         # permite tocar "Run workflow" a mano desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests markdownify

      - name: Correr el scraper
        run: python scraper.py

      - name: Guardar los cambios en el repositorio
        run: |
          git config user.name "catalogo-bot"
          git config user.email "catalogo-bot@users.noreply.github.com"
          git add products.json
          git diff --staged --quiet || git commit -m "Actualizar catálogo"
          git push
